<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tremendous Countdown. The Best Countdown.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a2e;
            --text: #e0e0e0;
            --silhouette-bg: #2a2a3e;
            --pct-color: #fff;
            --pct-shadow: rgba(0, 0, 0, 0.7);
            --label-color: #ccc;
            --stat-label: #888;
            --clock-color: #666;
            --quote-color: #777;
            --quote-attr: #555;
            --fired-bg: rgba(0, 0, 0, 0.85);
            --fired-sub: #aaa;
        }

        .light {
            --bg: #f5f5f5;
            --text: #222;
            --silhouette-bg: #ddd;
            --pct-color: #fff;
            --pct-shadow: rgba(0, 0, 0, 0.5);
            --label-color: #eee;
            --stat-label: #666;
            --clock-color: #888;
            --quote-color: #555;
            --quote-attr: #888;
            --fired-bg: rgba(255, 255, 255, 0.9);
            --fired-sub: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: #ff8c00;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .silhouette-wrap {
            position: relative;
            width: 300px;
            height: 400px;
        }

        .silhouette-bg,
        .silhouette-fill {
            position: absolute;
            inset: 0;
            -webkit-mask-image: url(trump.svg);
            mask-image: url(trump.svg);
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
        }

        .silhouette-bg {
            background: var(--silhouette-bg);
        }

        .silhouette-fill {
            background: linear-gradient(to bottom, #ffb347, #ff6600);
            clip-path: inset(0 0 0 0);
            transition: clip-path 2s ease-out;
        }

        .silhouette-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 30px;
            pointer-events: none;
        }

        .pct {
            font-size: 56px;
            font-weight: 700;
            color: var(--pct-color);
            text-shadow: 0 2px 8px var(--pct-shadow);
        }

        .remaining-label {
            font-size: 14px;
            color: #fff;
            letter-spacing: 0.1em;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.7);
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff8c00;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--stat-label);
            margin-top: 0.25rem;
        }

        .clock {
            font-size: 1rem;
            color: var(--clock-color);
            font-variant-numeric: tabular-nums;
            margin-top: 0.5rem;
        }

        .quote-ticker {
            max-width: 500px;
            text-align: center;
            font-style: italic;
            color: var(--quote-color);
            font-size: 0.9rem;
            line-height: 1.5;
            min-height: 3em;
            transition: opacity 0.5s;
        }

        .quote-ticker .quote-attr {
            font-style: normal;
            color: var(--quote-attr);
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .quote-ticker .quote-attr a {
            color: #ff8c00;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .quote-ticker .quote-attr a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .fired-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--fired-bg);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        .fired-overlay.active {
            display: flex;
        }

        .fired-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            color: #ff4500;
            text-shadow: 0 0 40px rgba(255, 69, 0, 0.6);
            animation: fireGlow 1.5s ease-in-out infinite alternate;
        }

        .fired-sub {
            font-size: 1.2rem;
            color: var(--fired-sub);
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: none;
            border: 1px solid var(--stat-label);
            color: var(--text);
            font-size: 1.4rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s, color 0.3s;
            z-index: 50;
        }

        .theme-toggle:hover {
            border-color: #ff8c00;
        }

        @keyframes fireGlow {
            from {
                text-shadow: 0 0 20px rgba(255, 69, 0, 0.4);
                transform: scale(1);
            }

            to {
                text-shadow: 0 0 60px rgba(255, 69, 0, 0.8);
                transform: scale(1.03);
            }
        }
    </style>
</head>

<body>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">☾</button>

    <div class="container">
        <h1>Tremendous Countdown. The Best Countdown.</h1>

        <div class="silhouette-wrap">
            <div class="silhouette-bg"></div>
            <div class="silhouette-fill" id="silhouetteFill"></div>
            <div class="silhouette-text">
                <div class="pct" id="pctText">100%</div>
                <div class="remaining-label">REMAINING</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="daysLeft">—</div>
                <div class="stat-label">Days Left</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="daysElapsed">—</div>
                <div class="stat-label">Days Elapsed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="endDate"></div>
                <div class="stat-label">Term Ends</div>
            </div>
        </div>

        <div class="clock" id="clock"></div>

        <div class="quote-ticker" id="quoteTicker"></div>
    </div>

    <div class="fired-overlay" id="firedOverlay">
        <div class="fired-text">YOU'RE FIRED!</div>
        <div class="fired-sub">Term has ended.</div>
    </div>

    <script>
        const START = new Date('2025-01-20T12:00:00-05:00').getTime();
        const END = new Date('2029-01-20T11:59:00-05:00').getTime();
        const TOTAL = END - START;

        const fillEl = document.getElementById('silhouetteFill');
        const pctText = document.getElementById('pctText');
        const daysLeft = document.getElementById('daysLeft');
        const daysElapsed = document.getElementById('daysElapsed');
        const endDateEl = document.getElementById('endDate');
        const clockEl = document.getElementById('clock');
        const quoteTicker = document.getElementById('quoteTicker');
        const firedOverlay = document.getElementById('firedOverlay');

        const quotes = [
            { text: "Despite the constant negative press covfefe", year: "2017", src: "https://www.bbc.com/news/world-us-canada-40124483" },
            { text: "I have the best words.", year: "2015", src: "https://www.esquire.com/news-politics/videos/a40610/trump-best-words/" },
            { text: "I'm, like, really smart. A very stable genius.", year: "2018", src: "https://www.nytimes.com/2018/01/06/us/politics/trump-genius.html" },
            { text: "Nobody knows more about taxes than I do, maybe in the history of the world.", year: "2016", src: "https://www.washingtonpost.com/news/the-fix/wp/2016/10/04/17-issues-that-donald-trump-knows-better-than-anyone-else-according-to-donald-trump/" },
            { text: "I think I am, actually humble. I think I'm much more humble than you would understand.", year: "2015", src: "https://www.cbsnews.com/news/donald-trump-60-minutes-interview/" },
            { text: "It's going to be huge. Believe me.", year: "", src: "" },
            { text: "I could stand in the middle of Fifth Avenue and shoot somebody, and I wouldn't lose any voters.", year: "2016", src: "https://www.npr.org/sections/thetwo-way/2016/01/23/464129029/donald-trump-i-could-shoot-somebody-and-i-wouldnt-lose-any-voters" },
            { text: "Nobody has better respect for intelligence than Donald Trump.", year: "2016", src: "https://www.politico.com/story/2016/12/trump-intelligence-briefings-232479" },
            { text: "I have a very good brain and I've said a lot of things.", year: "2016", src: "https://www.cnn.com/2016/03/16/politics/donald-trump-foreign-policy-advisor/index.html" },
            { text: "I know words. I have the best words.", year: "2015", src: "https://www.esquire.com/news-politics/videos/a40610/trump-best-words/" },
            { text: "Sorry losers and haters, but my I.Q. is one of the highest.", year: "2013", src: "https://x.com/realDonaldTrump/status/332308211321425920" },
            { text: "Nobody builds walls better than me, believe me.", year: "2015", src: "https://www.washingtonpost.com/news/post-politics/wp/2015/06/16/full-text-donald-trump-announces-a-presidential-bid/" },
            { text: "I will be the greatest jobs president that God ever created.", year: "2015", src: "https://www.washingtonpost.com/news/post-politics/wp/2015/06/16/full-text-donald-trump-announces-a-presidential-bid/" },
            { text: "I'm the least racist person you have ever interviewed.", year: "2018", src: "https://www.bbc.com/news/av/world-us-canada-42688638" },
            { text: "I'm speaking with myself, number one, because I have a very good brain.", year: "2016", src: "https://www.politico.com/blogs/2016-gop-primary-live-updates-and-results/2016/03/trump-foreign-policy-adviser-220853" },
            { text: "We're going to have the greatest economy in the history of our country. Maybe in the history of the world.", year: "2025", src: "" },
            { text: "We have a thing called the Constitution, which I cherish. But it doesn't always work the way we want it to.", year: "2025", src: "" },
            { text: "We're going to get Greenland and we're going to get the Panama Canal back.", year: "2025", src: "https://www.bbc.com/news/articles/c20m610ee0po" },
            { text: "I said I was going to do things that nobody thought were possible. And I've done them on Day 1.", year: "2025", src: "" },
            { text: "DOGE is doing an incredible job. Elon is a friend of mine and he's a genius.", year: "2025", src: "" },
            { text: "We're going to make Canada the 51st state. It would be a great state.", year: "2025", src: "https://www.bbc.com/news/articles/cz6jzx3v828o" },
            { text: "The tariffs are going to make us rich. Incredibly rich. The richest.", year: "2025", src: "" },
            { text: "Nobody's ever seen anything like what we're doing. It's never been done before.", year: "2025", src: "" },
            { text: "I've known Jeff for fifteen years. Terrific guy. He's a lot of fun to be with. It is even said that he likes beautiful women as much as I do, and many of them are on the younger side.", year: "2002", src: "https://nymag.com/nymetro/news/people/n_7912/" },
            { text: "You know what the magnet is? They have a thing called mag-a-lev... And if the ship gets hit by a missile, the electric goes out, the computer goes out, and guess what? The catapult is dead.", year: "2017", src: "https://time.com/4775040/donald-trump-time-interview-being-president/" },
            { text: "I said, 'What system are you going to be on?' 'Sir, we're using electromagnets.' I said, 'No, you're not. You're going to goddamn steam.'", year: "2017", src: "https://time.com/4775040/donald-trump-time-interview-being-president/" },
            { text: "Look, having nuclear — my uncle was a great professor at MIT... good genes, very good genes, OK, very smart... you know, if you're a conservative Republican... it's amazing how good I've been.", year: "2016", src: "https://www.snopes.com/fact-check/donald-trump-sentence/" },
            { text: "I see the disinfectant, where it knocks it out in one minute. And is there a way we can do something like that, by injection inside or almost a cleaning?", year: "2020", src: "https://www.bbc.com/news/world-us-canada-52407177" },
            { text: "If you have a windmill anywhere near your house... they say the noise causes cancer.", year: "2019", src: "https://www.bbc.com/news/world-us-canada-47815615" },
            { text: "I never understood wind. I know windmills very much, I've studied it better than anybody. They're made in China and Germany mostly, very few made here. But they're manufactured — tremendous, if you're into this — tremendous fumes.", year: "2019", src: "https://www.c-span.org/event/354841" },
            { text: "They want to have windmills all over the place... and you know what they don't tell you about windmills? They kill the birds and the whales.", year: "2023", src: "" },
            { text: "The windmills are driving the whales crazy. They're washing up on shore.", year: "2023", src: "https://apnews.com/article/fact-check-whales-offshore-wind-trump-947984646064" },
            { text: "China makes the magnets. Without the magnets, basically, the whole thing doesn't work.", year: "2023", src: "" },
            { text: "You go out and you want to buy some groceries... and you can't afford it. The grocery bill is two, three, four times what it was just a few years ago.", year: "2024", src: "" },
            { text: "I want to bring back the incandescent light bulb because I look better under an incandescent light than these horrible lights.", year: "2023", src: "https://www.theguardian.com/us-news/2023/jul/25/trump-incandescent-lightbulb-ban" },
            { text: "They had to rake the leaves. You wouldn't believe how fast that fire goes away once you rake the leaves.", year: "2018", src: "https://www.bbc.com/news/world-us-canada-46237410" },
            { text: "I looked right at it.", year: "2017", note: "on the solar eclipse", src: "https://www.bbc.com/news/av/world-us-canada-40997981" },
            { text: "I think there's blame on both sides, and I have no doubt about it.", year: "2017", note: "on Charlottesville", src: "https://www.bbc.com/news/world-us-canada-40935419" },
            { text: "Why can't we use nuclear weapons?", year: "2016", src: "https://www.cnbc.com/2016/08/03/trump-asks-why-us-cant-use-nukes-msnbcs-joe-scarborough-reports.html" },
            { text: "I don't stand by anything.", year: "2017", src: "https://www.cbsnews.com/news/trump-stands-by-nothing-on-wiretapping-claims/" },
            { text: "So there's a shark 10 yards away from the boat, 10 yards, or here. Do I get electrocuted if the boat is sinking, and water goes over the battery... and I'm in the water? Do I stay on top of the boat and get electrocuted, or do I jump over by the shark and not get electrocuted? I'll take electrocution every single time.", year: "2023", src: "https://www.theguardian.com/us-news/2023/may/07/trump-sharks-electric-boats-iowa" },
            { text: "The electric car thing is not going to work. They don't go far enough, they cost too much, and they're all made in China.", year: "2023", src: "" },
            { text: "The boats, they want to make them all electric. The problem is the boat is so heavy it can't float.", year: "2023", src: "https://www.theguardian.com/us-news/2023/may/07/trump-sharks-electric-boats-iowa" },
            { text: "The word is 'grocery.' It's a very old word. They don't use it too much anymore. Grocery. We need grocery. Groceries. We need everything.", year: "2025", src: "https://www.independent.co.uk/news/world/americas/us-politics/trump-grocery-old-word-b2688161.html" },
        ];

        let currentQuote = Math.floor(Math.random() * quotes.length);
        function showQuote() {
            const q = quotes[currentQuote];
            quoteTicker.style.opacity = '0';
            setTimeout(() => {
                quoteTicker.innerHTML = `\u201c${q.text}\u201d<div class="quote-attr">${q.year ? '\u2014 ' + q.year : ''}${q.note ? ' (' + q.note + ')' : ''}${q.src ? ' <a href="' + q.src + '" target="_blank" rel="noopener">[source]</a>' : ''}</div>`;
                quoteTicker.style.opacity = '1';
            }, 500);
            currentQuote = (currentQuote + 1) % quotes.length;
        }
        showQuote();
        setInterval(showQuote, 8000);

        // Format end date in user's locale
        const endDateObj = new Date(END);
        endDateEl.textContent = endDateObj.toLocaleDateString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric'
        });

        function getCountdownState() {
            const now = Date.now();
            const elapsed = Math.max(0, Math.min(TOTAL, now - START));
            const remaining = TOTAL - elapsed;
            const pct = remaining / TOTAL;

            return { elapsed, remaining, pct };
        }

        function renderVisuals(pct, displayPct = Math.round(pct * 100)) {
            const safePct = Math.max(0, Math.min(1, pct));
            const safeDisplayPct = Math.max(0, Math.min(100, displayPct));

            // Clip from top: inset(elapsedPct 0 0 0) reveals only the remaining portion
            const clipTop = ((1 - safePct) * 100).toFixed(4);
            fillEl.style.clipPath = `inset(${clipTop}% 0 0 0)`;

            // Update percentage text
            pctText.textContent = `${safeDisplayPct}%`;

            // Show YOU'RE FIRED when term ends
            if (safePct <= 0) {
                firedOverlay.classList.add('active');
            }
        }

        function renderTime(state) {
            const { elapsed, remaining } = state;

            // Update days
            const msPerDay = 86400000;
            daysLeft.textContent = Math.floor(remaining / msPerDay).toLocaleString();
            daysElapsed.textContent = Math.floor(elapsed / msPerDay).toLocaleString();

            // Countdown clock (d h m s)
            const totalSec = Math.floor(remaining / 1000);
            const d = Math.floor(totalSec / 86400);
            const h = Math.floor((totalSec % 86400) / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            clockEl.textContent = `${d}d ${h}h ${m}m ${s}s remaining`;
        }

        function update() {
            const state = getCountdownState();
            renderVisuals(state.pct);
            renderTime(state);
        }

        function animateIntro() {
            const state = getCountdownState();
            const targetPct = state.pct;
            const targetDisplayPct = Math.round(targetPct * 100);
            const digitSteps = Math.max(0, 100 - targetDisplayPct);
            const duration = Math.min(3000, Math.max(1200, digitSteps * 35));
            const startTime = performance.now();
            const targetClipTop = ((1 - targetPct) * 100).toFixed(4);

            renderTime(state);
            renderVisuals(1, 100);

            // Let the browser paint the initial 100% state before transitioning the fill.
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    fillEl.style.clipPath = `inset(${targetClipTop}% 0 0 0)`;
                    fillEl.addEventListener('transitionend', (e) => {
                        if (e.propertyName === 'clip-path') {
                            fillEl.style.transition = 'none';
                        }
                    }, { once: true });
                });
            });

            function frame(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const easedProgress = 1 - Math.pow(1 - progress, 3);
                const animatedDisplayPct = digitSteps > 0
                    ? Math.max(targetDisplayPct, 100 - Math.floor(easedProgress * digitSteps))
                    : 100;

                pctText.textContent = `${animatedDisplayPct}%`;

                if (progress < 1) {
                    requestAnimationFrame(frame);
                    return;
                }

                update();
                setInterval(update, 1000);
            }

            requestAnimationFrame(frame);
        }

        animateIntro();

        // Theme toggle
        const themeBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') document.body.classList.add('light');
        function updateIcon() {
            themeBtn.textContent = document.body.classList.contains('light') ? '\u2600' : '\u263E';
        }
        updateIcon();
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
            updateIcon();
        });
    </script>

</body>

</html>
